name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_CORE_VERSION: "6.1.19"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Build ${{ matrix.environment }}
        run: python -m platformio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_CORE_VERSION }}-native-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Enforce CI action pinning
        run: python tools/check_ci_action_pins.py

      - name: Enforce cross-framework CLI contract
        run: python tools/check_cli_contract.py

      - name: Enforce native ESP-IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Enforce version header contract
        run: python tools/check_version_header_contract.py

      - name: Build clean package consumer
        run: python tools/check_clean_consumer_package.py

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Run native tests
        run: python -m platformio test -e native

      - name: Compile framework-neutral core consumer
        run: python -m platformio run -e native_core_no_arduino

  validate-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: |
          python -m pip install --disable-pip-version-check "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Enforce CI action pinning
        run: python tools/check_ci_action_pins.py

      - name: Enforce example CLI contract
        run: python tools/check_cli_contract.py

      - name: Enforce IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Enforce version header contract
        run: python tools/check_version_header_contract.py

      - name: Build clean package consumer
        run: python tools/check_clean_consumer_package.py

      - name: Exercise tooling regressions without hardware
        run: |
          python tools/hil_opt4001_runner.py --parser-self-test
          python -m unittest discover -s tools -p 'test_*.py'

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Validate library package
        run: python -m platformio pkg pack . --output "${RUNNER_TEMP}/OPT4001.tar.gz"

      - name: Check generated files and whitespace
        run: |
          git diff --check
          git diff --exit-code

  idf-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32s3
          - esp32s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Build pure ESP-IDF ${{ matrix.target }}
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: examples/esp_idf/basic
          command: idf.py set-target ${{ matrix.target }} build

      - name: Upload ESP-IDF build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: esp-idf-build-logs-${{ matrix.target }}
          path: |
            examples/esp_idf/basic/build/**/*.log
            examples/esp_idf/basic/build/log/**
          if-no-files-found: ignore
