name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Build ${{ matrix.environment }}
        run: python -m platformio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Enforce public API documentation
        run: python tools/check_public_api_docs.py

      - name: Enforce version header contract
        run: python tools/check_version_header_contract.py

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Run native tests
        run: python -m platformio test -e native

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Enforce example CLI contract
        run: python tools/check_cli_contract.py

      - name: Enforce IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Enforce version header contract
        run: python tools/check_version_header_contract.py

      - name: Enforce readiness claims
        run: python tools/check_readiness_claims.py

      - name: Enforce public API documentation
        run: python tools/check_public_api_docs.py

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Validate library package
        run: python -m platformio pkg pack

  idf-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32s3
          - esp32s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build pure ESP-IDF ${{ matrix.target }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: examples/esp_idf/basic
          command: idf.py set-target ${{ matrix.target }} build
